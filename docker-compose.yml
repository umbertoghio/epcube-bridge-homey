services:
  epcube-bridge:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - epcube-data:/data
    environment:
      EPCUBE_EMAIL: ${EPCUBE_EMAIL:?Set EPCUBE_EMAIL}
      EPCUBE_PASSWORD: ${EPCUBE_PASSWORD:?Set EPCUBE_PASSWORD}
      EPCUBE_REGION: ${EPCUBE_REGION:-EU}
      EPCUBE_TIMEZONE: ${EPCUBE_TIMEZONE:-Europe/Rome}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-30}
      MQTT_HOST: ${MQTT_HOST:?Set MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-false}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-epcube}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
      ENABLE_CONTROLS: ${ENABLE_CONTROLS:-false}
volumes:
  epcube-data:
